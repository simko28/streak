<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Streak">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0B0B10">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<title>Streak</title>
<style>
:root{
  --bg:#0B0B10; --lift:#15151E; --lift2:#1D1D28; --edge:#262634;
  --ink:#F4F4F8; --dim:#8C8CA3; --faint:#3A3A4C;
  --r:22px; --pad:16px;
}
body.light{
  --bg:#F3F2F7; --lift:#FFFFFF; --lift2:#FFFFFF; --edge:#E5E4EE;
  --ink:#14141C; --dim:#7B7B90; --faint:#DCDBE6;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Inter,system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior-y:none;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;font-variant-numeric:tabular-nums}
.wrap{padding:0 var(--pad);max-width:520px;margin:0 auto}

/* ---------- top ---------- */
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) var(--pad) 6px;
  max-width:520px;margin:0 auto}
.top h1{flex:1;margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em}
.top p{margin:2px 0 0;font-size:13px;color:var(--dim);font-weight:500;letter-spacing:0}
.round{width:40px;height:40px;border-radius:50%;background:var(--lift);display:grid;place-items:center;flex:none;
  transition:transform .12s}
.round:active{transform:scale(.9)}
.round svg{width:20px;height:20px;fill:var(--ink)}

/* ---------- hero ---------- */
.hero{position:relative;display:flex;align-items:center;gap:18px;background:var(--lift);
  border-radius:26px;padding:20px;margin:12px 0 14px;overflow:hidden}
.hero .glow{position:absolute;width:200px;height:200px;border-radius:50%;filter:blur(70px);opacity:.22;
  right:-50px;top:-80px;pointer-events:none;transition:background .5s}
.hero .num{font-size:44px;font-weight:800;letter-spacing:-.04em;line-height:1}
.hero .sub{font-size:13.5px;color:var(--dim);margin-top:5px;font-weight:500;letter-spacing:0}
.hero .flame{display:inline-flex;align-items:center;gap:5px;background:var(--lift2);border:1px solid var(--edge);
  padding:5px 11px;border-radius:999px;font-size:13px;font-weight:700;margin-top:11px}
.dial{width:104px;height:104px;flex:none;position:relative}
.dial svg{transform:rotate(-90deg);width:100%;height:100%}
.dial circle{transition:stroke-dasharray .55s cubic-bezier(.34,1.4,.5,1),opacity .3s}
.dial .mid{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:800;letter-spacing:-.03em}

/* ---------- week strip ---------- */
.week{display:flex;gap:6px;margin-bottom:16px}
.wd{flex:1;background:var(--lift);border-radius:16px;padding:9px 0 8px;text-align:center;transition:transform .12s,background .2s}
.wd:active{transform:scale(.93)}
.wd.sel{background:var(--ink)}
.wd.sel .l,.wd.sel .n{color:var(--bg)}
.wd .l{font-size:10px;font-weight:700;color:var(--dim);letter-spacing:.08em}
.wd .n{font-size:15px;font-weight:700;margin-top:2px}
.wd .dots{display:flex;justify-content:center;gap:2px;margin-top:6px;height:4px}
.wd .dots i{width:4px;height:4px;border-radius:50%;background:var(--faint)}

/* ---------- habit cards ---------- */
.card{display:flex;align-items:center;gap:14px;background:var(--lift);border-radius:var(--r);
  padding:14px;margin-bottom:10px;position:relative;overflow:hidden;transition:transform .13s cubic-bezier(.34,1.5,.5,1)}
.card.press{transform:scale(.975)}
.card .tint{position:absolute;inset:0;opacity:.10;pointer-events:none;transition:opacity .3s}
.glyph{width:46px;height:46px;border-radius:15px;flex:none;display:grid;place-items:center;
  font-size:20px;font-weight:800;color:#fff;position:relative;z-index:1}
.body{flex:1;min-width:0;position:relative;z-index:1}
.body h3{margin:0;font-size:16.5px;font-weight:700;letter-spacing:-.02em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.body p{margin:3px 0 0;font-size:12.5px;color:var(--dim);font-weight:500;letter-spacing:0}
.meter{height:5px;border-radius:3px;background:var(--faint);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;transition:width .5s cubic-bezier(.34,1.3,.5,1)}
.tick{width:38px;height:38px;border-radius:50%;flex:none;border:2.5px solid var(--faint);
  display:grid;place-items:center;position:relative;z-index:1;transition:transform .18s cubic-bezier(.34,1.7,.4,1),
  background .2s,border-color .2s}
.tick svg{width:20px;height:20px;fill:none;stroke:#fff;stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:26;stroke-dashoffset:26;transition:stroke-dashoffset .28s ease .04s}
.tick.on svg{stroke-dashoffset:0}
.tick.pop{transform:scale(1.28)}
.chip{padding:8px 13px;border-radius:14px;background:var(--lift2);border:1px solid var(--edge);
  font-size:15px;font-weight:800;letter-spacing:-.02em;position:relative;z-index:1;white-space:nowrap}
.card.due .body p{color:#FFC53D;font-weight:700}
.card.due{box-shadow:inset 0 0 0 1.5px rgba(255,197,61,.4)}
.card.skipped{opacity:.42}
.card.skipped .body h3{text-decoration:line-through;text-decoration-thickness:2px}

.task{display:flex;align-items:center;gap:13px;background:transparent;border:1px solid var(--edge);
  border-radius:15px;padding:12px 14px;margin-bottom:8px;transition:transform .13s cubic-bezier(.34,1.5,.5,1),opacity .25s}
.task.press{transform:scale(.98)}
.task .tbox{width:24px;height:24px;border-radius:8px;border:2px solid var(--faint);flex:none;
  display:grid;place-items:center;transition:background .2s,border-color .2s}
.task .tbox svg{width:15px;height:15px;fill:none;stroke:var(--bg);stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.task.off{opacity:.45}
.task.off .tbox{background:var(--ink);border-color:var(--ink)}
.task.off .tt b{text-decoration:line-through;text-decoration-thickness:2px}
.tt{min-width:0}
.tt b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt em{font-style:normal;font-size:11.5px;color:var(--dim);font-weight:600}
.tt em.late{color:#FFC53D}
.addtask{width:100%;text-align:left;padding:12px 14px;border-radius:15px;border:1px dashed var(--edge);
  color:var(--dim);font-size:14px;font-weight:700;margin-bottom:4px}
.addtask:active{background:var(--lift)}
.rr{display:flex;align-items:center;gap:11px;background:var(--lift2);border:1px solid var(--edge);
  border-radius:14px;padding:13px 12px;margin-bottom:8px;touch-action:none;position:relative}
.rr.pinned{border-color:var(--dim)}
.rr.lift{z-index:5;box-shadow:0 12px 28px rgba(0,0,0,.45);transform-origin:center;opacity:.97}
.rh{color:var(--faint);font-size:15px;letter-spacing:-2px;flex:none;cursor:grab}
.rn{flex:1;min-width:0;font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinb{width:32px;height:32px;border-radius:10px;flex:none;display:grid;place-items:center}
.pinb svg{width:17px;height:17px;fill:var(--faint);transition:fill .2s,transform .25s cubic-bezier(.34,1.6,.5,1)}
.pinb.on svg{fill:var(--ink);transform:rotate(-20deg) scale(1.1)}
.pinmark{width:11px;height:11px;flex:none;vertical-align:-1px;margin-left:5px;fill:var(--dim)}
.card.pinned{box-shadow:inset 0 0 0 1.5px var(--edge)}
.icrow{display:flex;align-items:center;gap:10px}
.icprev{width:44px;height:44px;border-radius:14px;flex:none;display:grid;place-items:center;
  font-size:19px;font-weight:800;color:#fff}
.icprev.emoji{font-size:24px}
.icrow input{flex:1;min-width:0;background:var(--lift2);border:1px solid var(--edge);border-radius:14px;
  padding:12px 13px;font-size:15px;font-weight:600;color:var(--ink);outline:none;
  -webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;font-family:inherit}
.icclr{padding:12px 13px;border-radius:14px;background:var(--lift2);border:1px solid var(--edge);
  font-size:13px;font-weight:700;color:var(--dim);flex:none}
.emgrid{display:none;grid-template-columns:repeat(8,1fr);gap:6px;margin-top:10px}
.emgrid.open{display:grid}
.icpick{width:100%;margin-top:8px;padding:11px;border-radius:14px;background:var(--lift2);
  border:1px solid var(--edge);font-size:13.5px;font-weight:700;color:var(--dim);
  transition:border-color .2s,color .2s}
.icpick.on{border-color:var(--ac,#7C6BFF);color:var(--ink)}
.emgrid button{padding:7px 0;border-radius:11px;font-size:20px;line-height:1.25;background:var(--lift2);
  transition:transform .1s,background .15s}
.emgrid button:active{transform:scale(.88)}
.emgrid button.on{background:var(--ac,#7C6BFF)}
.gem{font-size:15px;flex:none;width:18px;text-align:center}
.optrow{width:100%;display:flex;align-items:center;gap:12px;background:var(--lift2);border:1px solid var(--edge);
  border-radius:14px;padding:12px 13px;text-align:left;transition:border-color .2s}
.optrow.on{border-color:var(--ac,#7C6BFF)}
.optrow .obox{width:32px;height:32px;border-radius:10px;background:var(--bg);display:grid;place-items:center;flex:none}
.optrow .obox svg{width:16px;height:16px;fill:var(--dim)}
.optrow.on .obox svg{fill:var(--ac,#7C6BFF)}
.otxt{flex:1;min-width:0}
.otxt b{display:block;font-size:14.5px;font-weight:700}
.otxt em{font-style:normal;font-size:11.5px;color:var(--dim);font-weight:600}
.odot{width:20px;height:20px;border-radius:50%;border:2px solid var(--faint);flex:none;transition:background .2s,border-color .2s}
.optrow.on .odot{background:var(--ac,#7C6BFF);border-color:var(--ac,#7C6BFF)}
.cam{width:34px;height:34px;border-radius:12px;flex:none;display:grid;place-items:center;position:relative;z-index:1;
  background:var(--lift2);border:1px solid var(--edge);transition:transform .12s}
.cam:active{transform:scale(.9)}
.cam svg{width:17px;height:17px;fill:var(--dim)}
.glyph.emoji{font-size:25px;font-weight:400}
.glyph img{width:100%;height:100%;object-fit:cover;border-radius:15px;position:absolute;inset:0}
.strip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.shot{width:78px;flex:none;position:relative}
.shot img{width:78px;height:98px;object-fit:cover;border-radius:12px;display:block;background:var(--faint)}
.shot span{display:block;font-size:10px;font-weight:700;color:var(--dim);margin-top:5px;text-align:center}
.shot b{position:absolute;top:5px;left:5px;background:rgba(0,0,0,.55);color:#fff;font-size:9.5px;
  font-weight:800;padding:2px 6px;border-radius:6px}
#viewer{position:fixed;inset:0;background:rgba(6,6,10,.96);z-index:70;display:none;
  flex-direction:column;align-items:center;justify-content:center;padding:16px}
#viewer.on{display:flex}
#viewer img{max-width:100%;max-height:70vh;border-radius:14px;object-fit:contain}
#viewer .vinfo{color:#fff;font-size:14px;font-weight:700;margin-top:14px;text-align:center}
#viewer .vinfo em{display:block;font-style:normal;font-size:12px;color:#9a9aae;font-weight:600;margin-top:4px}
#viewer .vbar{display:flex;gap:10px;margin-top:16px}
#viewer .vbar button{padding:11px 18px;border-radius:14px;background:rgba(255,255,255,.12);color:#fff;
  font-size:14px;font-weight:700}
.cmp{display:flex;gap:10px}
.cmp>div{flex:1;text-align:center}
.cmp img{width:100%;height:190px;object-fit:cover;border-radius:12px;background:var(--faint)}
.cmp span{display:block;font-size:11px;font-weight:700;color:var(--dim);margin-top:6px}
.orig{display:flex;align-items:baseline;gap:8px}
.orig b{font-size:30px;font-weight:800;letter-spacing:-.04em}
.orig span{font-size:13px;color:var(--dim);font-weight:600}
.obar{display:flex;gap:3px;height:8px;margin:12px 0 10px}
.obar i{border-radius:4px}
.ol{margin:0;font-size:13px;color:var(--dim);font-weight:500;line-height:1.6}
.ol b{color:var(--ink);font-weight:800}
.later{margin:16px 2px 0;font-size:12.5px;color:var(--dim);font-weight:600;line-height:1.9}
.later span{display:inline-flex;align-items:center;gap:6px;margin-right:12px}
.later i{width:6px;height:6px;border-radius:50%;opacity:.65}
.offday{width:5px;height:5px;border-radius:50%;background:var(--faint)}
.sect{font-size:11.5px;font-weight:800;letter-spacing:.1em;color:var(--dim);margin:22px 0 10px;text-transform:uppercase}
.blank{text-align:center;color:var(--dim);padding:60px 24px;font-size:15px;line-height:1.65;font-weight:500;letter-spacing:0}

/* ---------- bottom nav ---------- */
.nav{position:fixed;left:50%;transform:translate(-50%,0);bottom:calc(14px + env(safe-area-inset-bottom));
  display:flex;gap:4px;background:var(--lift);border:1px solid var(--edge);padding:6px;border-radius:999px;
  z-index:30;box-shadow:0 10px 34px rgba(0,0,0,.45);
  transition:transform .38s cubic-bezier(.32,1.2,.4,1),opacity .26s}
.nav.hide{transform:translate(-50%,170%);opacity:0;pointer-events:none}
.pill{position:absolute;top:6px;bottom:6px;left:6px;width:0;border-radius:999px;background:var(--ink);
  transform:translateX(0);pointer-events:none;
  transition:transform .46s cubic-bezier(.32,1.3,.4,1), width .46s cubic-bezier(.32,1.3,.4,1)}
.pill.jump{transition:none}
body.light .nav{box-shadow:0 8px 26px rgba(20,20,40,.14)}
.nav button{padding:10px 20px;border-radius:999px;display:flex;align-items:center;gap:7px;position:relative;z-index:1;
  font-size:13.5px;font-weight:700;color:var(--dim);
  transition:color .32s cubic-bezier(.16,1,.3,1),transform .12s}
.nav button:active{transform:scale(.94)}
.nav button svg{width:18px;height:18px;fill:currentColor;transition:transform .34s cubic-bezier(.34,1.6,.5,1)}
.nav button.on{color:var(--bg)}
.nav button.on svg{transform:scale(1.12)}
.nav button.on{background:var(--ink);color:var(--bg)}

/* ---------- grid view ---------- */
.grid{background:var(--lift);border-radius:var(--r);overflow:hidden}
.grow{display:flex;align-items:center;height:58px;border-bottom:1px solid var(--edge)}
.grow:last-child{border-bottom:0}
.gname{flex:1;min-width:0;padding-left:14px;display:flex;align-items:center;gap:9px}
.gname span{font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gdot{width:8px;height:8px;border-radius:50%;flex:none}
.gcell{width:var(--cw);height:100%;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.gcell .box{width:26px;height:26px;border-radius:9px;background:var(--faint);display:grid;place-items:center}
.gcell .box svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:3.6;stroke-linecap:round;stroke-linejoin:round}
.ghead{display:flex;padding:0 0 10px}
.ghead .gcell{font-size:10.5px;color:var(--dim);font-weight:700;letter-spacing:.05em;height:auto;display:block;text-align:center}
.ghead .gcell b{display:block;font-size:13px;color:var(--ink);margin-top:2px}
.pager{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pager button{padding:8px 14px;background:var(--lift);border-radius:999px;font-size:13px;font-weight:700;color:var(--dim)}
.pager button:disabled{opacity:.35}

/* ---------- stats ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--lift);border-radius:20px;padding:16px}
.tile b{display:block;font-size:30px;font-weight:800;letter-spacing:-.04em}
.tile span{font-size:12px;color:var(--dim);font-weight:600;letter-spacing:0}
.srow{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--edge)}
.srow:last-child{border-bottom:0}
.srow .lbl{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .track{width:96px;height:7px;border-radius:4px;background:var(--faint);overflow:hidden;flex:none}
.srow .track i{display:block;height:100%;border-radius:4px}
.srow .pct{width:40px;text-align:right;font-size:13px;font-weight:800;flex:none}

/* ---------- detail ---------- */
.stat3{display:flex;text-align:center;gap:10px}
.stat3>div{flex:1;background:var(--lift);border-radius:20px;padding:15px 8px}
.stat3 b{display:block;font-size:25px;font-weight:800;letter-spacing:-.04em}
.stat3 span{font-size:11px;color:var(--dim);font-weight:600;letter-spacing:0}
.cal{display:flex;gap:3px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.cal::-webkit-scrollbar{display:none}
.wkcol{display:flex;flex-direction:column;gap:3px}
.sq{width:13px;height:13px;border-radius:4px;background:var(--faint)}
.bars{display:flex;align-items:flex-end;gap:2px;height:88px}
.bars i{flex:1;border-radius:3px 3px 1px 1px;min-height:3px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:rgba(4,4,10,.68);backdrop-filter:blur(6px);z-index:60;
  display:none;align-items:flex-end;justify-content:center}
.scrim.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--lift);border-radius:28px 28px 0 0;padding:10px 20px
  calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(100%)}}
.grab{width:38px;height:4px;border-radius:3px;background:var(--faint);margin:0 auto 16px}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.sheet .note{font-size:13px;color:var(--dim);margin:0 0 18px;line-height:1.55;font-weight:500;letter-spacing:0}
.fld{margin-bottom:14px}
.fld em{display:block;font-style:normal;font-size:11.5px;font-weight:700;color:var(--dim);
  letter-spacing:.07em;text-transform:uppercase;margin-bottom:7px}
.fld input,.fld select,.sheet textarea{width:100%;background:var(--lift2);border:1px solid var(--edge);
  border-radius:14px;padding:13px 14px;font-size:16px;font-weight:600;color:var(--ink);outline:none;
  -webkit-user-select:text;user-select:text;-webkit-appearance:none;appearance:none;font-family:inherit}
.fld input:focus,.fld select:focus{border-color:var(--ac,#7C6BFF)}
.row2{display:flex;gap:12px}.row2>*{flex:1}
.seg{display:flex;background:var(--lift2);border:1px solid var(--edge);border-radius:14px;padding:4px;margin-bottom:16px}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:14px;font-weight:700;color:var(--dim)}
.seg button.on{background:var(--ac,#7C6BFF);color:#fff}
.entry{padding:12px 0;border-bottom:1px solid var(--edge)}
.entry:last-child{border-bottom:0}
.ed{font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--dim);margin-bottom:7px}
.ei{display:flex;align-items:flex-start;gap:9px;font-size:14.5px;font-weight:500;line-height:1.45;margin-bottom:5px;
  -webkit-user-select:text;user-select:text}
.ei span{width:6px;height:6px;border-radius:50%;flex:none;margin-top:7px}
.lrow{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.lrow .ln{width:24px;height:24px;border-radius:9px;flex:none;display:grid;place-items:center;
  font-size:12px;font-weight:800;color:#fff}
.lrow input{flex:1;background:var(--lift2);border:1px solid var(--edge);border-radius:13px;padding:12px 13px;
  font-size:15.5px;font-weight:600;color:var(--ink);outline:none;-webkit-user-select:text;user-select:text;
  -webkit-appearance:none;appearance:none;font-family:inherit;min-width:0}
.lrow input:focus{border-color:var(--ac,#7C6BFF)}
.lrow .lx{width:28px;height:28px;flex:none;color:var(--dim);font-size:14px;border-radius:50%}
.days7{display:flex;gap:7px}
.days7 button{flex:1;padding:12px 0;border-radius:13px;background:var(--lift2);border:1px solid var(--edge);
  font-size:14px;font-weight:800;color:var(--dim);transition:transform .1s,background .2s,color .2s}
.days7 button:active{transform:scale(.92)}

<script>
/* ---------------------------------------------------------------
   Storage adapter.
   Inside a Claude artifact, window.storage already exists.
   Anywhere else (local file, your own domain) this shim provides the
   same API: localStorage for state, IndexedDB for photos, because
   base64 images blow past the 5MB localStorage quota fast.
   Nothing below this block knows or cares which one is in use.
----------------------------------------------------------------*/
if (!window.storage){
  const big = k => k.startsWith('photo:') || k.startsWith('thumbs:');
  let dbp = null;
  const db = () => dbp ||= new Promise((res,rej) => {
    const r = indexedDB.open('habits-store', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  const idb = async (mode, fn) => {
    const d = await db();
    return new Promise((res,rej) => {
      const q = fn(d.transaction('kv', mode).objectStore('kv'));
      q.onsuccess = () => res(q.result);
      q.onerror = () => rej(q.error);
    });
  };
  window.storage = {
    async get(k){
      const v = big(k) ? await idb('readonly', s => s.get(k)) : localStorage.getItem(k);
      if (v == null) throw new Error('not found: ' + k);
      return { key:k, value:v, shared:false };
    },
    async set(k, v){
      big(k) ? await idb('readwrite', s => s.put(v,k)) : localStorage.setItem(k, v);
      return { key:k, value:v, shared:false };
    },
    async delete(k){
      big(k) ? await idb('readwrite', s => s.delete(k)) : localStorage.removeItem(k);
      return { key:k, deleted:true, shared:false };
    },
    async list(prefix = ''){
      return { keys: Object.keys(localStorage).filter(k => k.startsWith(prefix)), prefix, shared:false };
    }
  };
}
</script>

<script>
/* ---------------------------------------------------------------
   Installed app plumbing. Relative paths throughout, so this runs
   from any subdirectory (a GitHub Pages project site, say).
----------------------------------------------------------------*/
if ('serviceWorker' in navigator && location.protocol.startsWith('http'))
  addEventListener('load', () => navigator.serviceWorker.register('./sw.js', { scope: './' }).catch(() => {}));
/* Safari throws away data from sites you have not installed after 7 idle days.
   Asking to persist is free, and granted outright once the app is on the Home Screen. */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
</script>

<script>
/* ================= data ================= */
const KEY = 'loop-habits-v1';
let S = { habits: [], log: {}, tasks: [], photos: {}, theme: 'dark' };
let timer = null, dirty = false, storageOK = null;
async function load(){ try{ const r = await window.storage.get(KEY);
  if (r && r.value){ S = Object.assign(S, JSON.parse(r.value)); storageOK = true; return true; } }catch(e){}
  return false; }
function save(){ dirty = true; clearTimeout(timer); timer = setTimeout(async () => {
  try{ await window.storage.set(KEY, JSON.stringify(S)); storageOK = true; dirty = false; }
  catch(e){ storageOK = false; }
  banner(); }, 250); }
function banner(){
  const w = document.getElementById('warn');
  w.classList.toggle('on', storageOK === false);
  if (storageOK === false) w.textContent = 'Not saving yet — publish this artifact so it can store your history. Until then, everything resets when you close it.';
}
addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && !dirty && storageOK !== false){ await load(); render(); }
});

const DAY = 864e5;
const WD = ['S','M','T','W','T','F','S'], WD3 = ['SUN','MON','TUE','WED','THU','FRI','SAT'];
const MO = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const key = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const shift = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const pd = k => { const [y,m,d] = k.split('-').map(Number); return new Date(y,m-1,d); };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const COLORS = ['#FF6B57','#FF8A3D','#FFC53D','#8BE04E','#3DD68C','#2DD4BF','#38BDF8','#5B8DEF',
                '#7C6BFF','#AB9FF2','#E879F9','#FF5CA8','#F87171','#94A3B8'];
const FREQS = [[1,1,'Every day'],[6,7,'6× a week'],[5,7,'5× a week'],[4,7,'4× a week'],
               [3,7,'3× a week'],[2,7,'2× a week'],[1,7,'Once a week'],[1,30,'Once a month']];
const freqLabel = h => (FREQS.find(f => f[0]===h.fnum && f[1]===h.fden) || [,, ''])[2];
const DAYNAME = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const DAYSHORT = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const daysBetween = (a,b) => Math.max(0, Math.round((pd(b) - pd(a))/DAY));
function humanSpan(n){
  if (n < 1) return 'today';
  if (n === 1) return '1 day';
  if (n < 21) return n + ' days';
  if (n < 60) return Math.round(n/7) + ' weeks';
  if (n < 365) return Math.round(n/30.4) + ' months';
  const y = Math.floor(n/365), m = Math.round((n % 365)/30.4);
  return y + (y > 1 ? ' years' : ' year') + (m ? ' ' + m + ' mo' : '');
}
const firstDay = h => h.created || Object.keys(S.log[h.id] || {}).sort()[0] || key(today());
const dueOn = (h,k) => !h.days || !h.days.length || h.days.includes(pd(k).getDay());
const dueList = k => live().filter(h => dueOn(h,k));
const schedLabel = h => !h.days || !h.days.length ? freqLabel(h)
  : h.days.length === 7 ? 'Every day'
  : h.days.length === 1 ? 'Every ' + DAYNAME[h.days[0]]
  : h.days.slice().sort().map(d => DAYSHORT[d]).join(', ');
const UNITS = ['km','m','mi','steps','min','hours','pages','words','reps','sets','glasses','l','kcal','€'];
const MI_PER_KM = 0.621371;
const convert = (v, from, to) => from === 'km' && to === 'mi' ? v*MI_PER_KM
                              : from === 'mi' && to === 'km' ? v/MI_PER_KM : v;

const live = () => S.habits.filter(h => !h.archived)
  .sort((a,b) => (b.pinned?1:0)-(a.pinned?1:0) || (a.pos ?? 0)-(b.pos ?? 0));
const setOrder = (list, from, to) => {
  const arr = list.slice(), [it] = arr.splice(from,1);
  arr.splice(to,0,it);
  arr.forEach((h,i) => { const o = S.habits.find(x => x.id === h.id); if (o) o.pos = i; });
  S.habits.filter(h => h.archived).forEach((h,i) => h.pos = arr.length + i);
  save();
};
const val = (h,k) => { const m = S.log[h.id]; return m && k in m ? m[k] : 0; };
const items = (h,k) => { const v = val(h,k); return Array.isArray(v) ? v.filter(x => String(x).trim()) : []; };
const setVal = (h,k,v) => { (S.log[h.id] ||= {}); v === 0 ? delete S.log[h.id][k] : S.log[h.id][k] = v; save(); };
const done = (h,k) => h.type === 'list' ? items(h,k).length >= h.target
  : h.type === 'num' ? (val(h,k) > 0 && val(h,k) >= h.target) : val(h,k) === 1;
const skipped = (h,k) => val(h,k) === -1;
const ratio = (h,k) => { const v = val(h,k); if (v === -1) return 0;
  return h.type === 'list' ? Math.min(1, items(h,k).length/(h.target||1))
    : h.type === 'num' ? Math.min(1, Math.max(0,v)/(h.target||1)) : (v === 1 ? 1 : 0); };

/* ---------- one-off tasks (kept out of every habit metric) ---------- */
const tk = () => key(today());
const tasksFor = k => S.tasks.filter(t => t.doneAt ? t.doneAt === k
  : k === tk() ? (!t.due || t.due <= k) : t.due === k);
const lateBy = t => !t.due || t.doneAt ? 0 : Math.round((pd(tk()) - pd(t.due))/DAY);
const dueLabel = t => {
  if (t.doneAt) return 'Done';
  if (!t.due) return 'No date';
  const n = lateBy(t);
  if (n > 0) return n === 1 ? '1 day late' : `${n} days late`;
  if (t.due === tk()) return 'Today';
  if (t.due === key(shift(today(),1))) return 'Tomorrow';
  return pd(t.due).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
};

function score(h, upto){
  const sched = h.days && h.days.length;
  const f = sched ? 1 : h.fnum/h.fden, m = Math.pow(.5, Math.sqrt(f)/13);
  let s = 0, d = shift(upto,-400);
  while (d <= upto){ const k = key(d);
    if (!skipped(h,k) && dueOn(h,k)) s = s*m + (1-m)*Math.min(1, ratio(h,k)/f);
    d = shift(d,1); }
  return Math.max(0, Math.min(1,s));
}
function streaks(h){
  const ks = Object.keys(S.log[h.id]||{}).sort();
  if (!ks.length) return {list:[],best:0,current:0};
  const out = []; let run = null, d = pd(ks[0]); const end = today(), ek = key(end);
  while (d <= end){ const k = key(d);
    if (done(h,k)) run ? (run.n++, run.end = k) : (run = {n:1,end:k});
    // today is still open: no tick yet today does not end the run
    else if (!skipped(h,k) && dueOn(h,k) && k !== ek){ if (run){ out.push(run); run = null; } }
    d = shift(d,1); }
  if (run) out.push(run);
  let last = end, g = 0;
  while (!dueOn(h,key(last)) && g++ < 400) last = shift(last,-1);
  let live_ = done(h,key(last));
  if (!live_ && key(last) === key(end)){
    let prev = shift(last,-1), g2 = 0;
    while (!dueOn(h,key(prev)) && g2++ < 400) prev = shift(prev,-1);
    live_ = done(h,key(prev));
  }
  const cur = run && live_ ? run.n : 0;
  return { list: out.slice().sort((a,b)=>b.n-a.n).slice(0,5), best: out.reduce((a,b)=>Math.max(a,b.n),0), current: cur };
}
const dayPct = k => { const l = dueList(k).filter(h => !skipped(h,k)); if (!l.length) return 0;
  return l.reduce((a,h) => a + ratio(h,k), 0) / l.length; };
const perfect = k => { const l = dueList(k).filter(h => !skipped(h,k)); return l.length > 0 && l.every(h => done(h,k)); };
const hasDue = k => dueList(k).filter(h => !skipped(h,k)).length > 0;
function fireStreak(){
  if (!live().length) return 0;
  let n = 0, d = today(), guard = 0;
  if (hasDue(key(d)) && !perfect(key(d))) d = shift(d,-1);
  while (guard++ < 400){
    const k = key(d);
    if (!hasDue(k)){ d = shift(d,-1); continue; }   // rest day: neither counts nor breaks
    if (!perfect(k)) break;
    n++; d = shift(d,-1);
  }
  return n;
}

/* ================= view state ================= */
let tab = 'today', sel = key(today()), page = 0, open = null, cols = 5;
const $ = s => document.querySelector(s);
const screen = $('#screen');

const ORDER = { today:0, grid:1, stats:2 }, TABS = ['today','grid','stats'];
const slow = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
let moving = false;

function go(dir, paint){
  if (slow() || moving){ paint(); return; }
  moving = true;
  const dx = 34 * (dir || 0);
  const out = screen.animate(
    [{opacity:1, transform:'none'}, {opacity:0, transform:`translateX(${-dx}px)`}],
    {duration:130, easing:'cubic-bezier(.4,0,1,1)', fill:'forwards'});
  out.onfinish = () => {
    paint(); scrollTo(0,0); out.cancel();
    screen.animate([{opacity:0, transform:`translateX(${dx}px)`}, {opacity:1, transform:'none'}],
      {duration:270, easing:'cubic-bezier(.16,1,.3,1)'});
    stagger();
    moving = false;
  };
}
function stagger(){
  if (slow()) return;
  const head = document.querySelector('.top > div');
  if (head) head.animate([{opacity:0, transform:'translateY(-6px)'},{opacity:1, transform:'none'}],
    {duration:280, easing:'cubic-bezier(.16,1,.3,1)'});
  screen.querySelectorAll('.hero,.week,.card,.tile,.stat3>div,.grow,.pager,.ghead,.sect')
    .forEach((el,i) => el.animate(
      [{opacity:0, transform:'translateY(10px)'},{opacity:1, transform:'none'}],
      {duration:330, delay:Math.min(i*26, 240), easing:'cubic-bezier(.16,1,.3,1)', fill:'backwards'}));
}

function movePill(jump){
  const pill = $('#pill'), on = document.querySelector('#nav button.on');
  if (!pill || !on || !on.offsetWidth) return;
  if (jump) pill.classList.add('jump');
  pill.style.width = on.offsetWidth + 'px';
  pill.style.transform = `translateX(${on.offsetLeft - 6}px)`;
  if (jump) requestAnimationFrame(() => requestAnimationFrame(() => pill.classList.remove('jump')));
}

function nav(t){
  const dir = open ? -1 : Math.sign((ORDER[t] ?? 0) - (ORDER[tab] ?? 0));
  const wasOpen = !!open;
  tab = t; open = null;
  document.querySelectorAll('#nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  $('#nav').classList.remove('hide'); $('#back').style.display = 'none'; $('#add').style.display = '';
  movePill(wasOpen);
  (dir || wasOpen) ? go(dir, render) : render();
}
function render(){
  if (open) return renderDetail();
  screen.scrollTop = 0;
  if (tab === 'today') renderToday();
  else if (tab === 'grid') renderGrid();
  else renderStats();
}

/* ================= today ================= */
function dial(k){
  const l = dueList(k);
  if (!l.length) return `<div class="dial"><svg viewBox="0 0 104 104">
    <circle cx="52" cy="52" r="44" fill="none" stroke="var(--faint)" stroke-width="8"/></svg>
    <div class="mid" style="color:var(--dim)">–</div></div>`;
  const C = 2*Math.PI*44, gap = l.length > 1 ? Math.min(9, C/l.length*.28) : 0;
  const segLen = l.length ? C/l.length - gap : 0;
  const arcs = l.map((h,i) => {
    const r = ratio(h, k), sk = skipped(h,k);
    return `<circle cx="52" cy="52" r="44" fill="none" stroke="${h.color}" stroke-width="8" stroke-linecap="round"
      opacity="${sk ? .12 : (r ? 1 : .16)}"
      stroke-dasharray="${(segLen*(sk?1:Math.max(r,.001))).toFixed(2)} ${(C).toFixed(2)}"
      stroke-dashoffset="${(-i*(C/l.length)).toFixed(2)}"/>`;
  }).join('');
  const base = l.map((h,i) => `<circle cx="52" cy="52" r="44" fill="none" stroke="var(--faint)" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${segLen.toFixed(2)} ${C.toFixed(2)}"
      stroke-dashoffset="${(-i*(C/l.length)).toFixed(2)}"/>`).join('');
  return `<div class="dial"><svg viewBox="0 0 104 104">${base}${arcs}</svg>
    <div class="mid">${Math.round(dayPct(k)*100)}%</div></div>`;
}

function renderToday(){
  const t = today(), l = dueList(sel), off = live().filter(h => !dueOn(h,sel));
  const d = pd(sel), isToday = sel === key(t);
  $('#title').textContent = isToday ? 'Today' : d.toLocaleDateString(undefined,{weekday:'long'});
  const tc = tasksFor(sel).filter(x => !x.doneAt).length;
  $('#sub').textContent = d.toLocaleDateString(undefined,{month:'long',day:'numeric'})
    + (tc ? ` · ${tc} task${tc===1?'':'s'}` : '');

  const n = l.filter(h => done(h,sel)).length, fire = fireStreak();
  const lead = l.find(h => !done(h,sel)) || l[0];
  const anyHabits = live().length;

  let week = '';
  for (let i = 6; i >= 0; i--){
    const dd = shift(t,-i), k = key(dd), p = dayPct(k);
    const dots = dueList(k).slice(0,5).map(h => `<i style="background:${done(h,k)?h.color:'var(--faint)'}"></i>`).join('');
    week += `<button class="wd ${k===sel?'sel':''}" data-day="${k}">
      <div class="l">${WD[dd.getDay()]}</div><div class="n">${dd.getDate()}</div>
      <div class="dots">${dots}</div></button>`;
  }

  const cards = l.map(h => {
    const isDone = done(h,sel), sk = skipped(h,sel), st = streaks(h);
    let right, meter = '';
    if (h.type === 'list'){
      const c = items(h,sel).length;
      right = `<div class="chip" style="${isDone?`background:${h.color};border-color:${h.color};color:#fff`:''}">${c}<span style="opacity:.6;font-weight:600">/${h.target}</span></div>`;
      meter = `<div class="meter"><i style="width:${Math.round(ratio(h,sel)*100)}%;background:${h.color}"></i></div>`;
    }
    else if (h.type === 'num'){
      const v = Math.max(0, val(h,sel));
      right = `<div class="chip" style="${isDone?`background:${h.color};border-color:${h.color};color:#fff`:''}">${+v.toFixed(2)}<span style="opacity:.6;font-weight:600"> ${esc(h.unit||'')}</span></div>`;
      meter = `<div class="meter"><i style="width:${Math.round(ratio(h,sel)*100)}%;background:${h.color}"></i></div>`;
    } else {
      right = `<div class="tick ${isDone?'on':''}" style="${isDone?`background:${h.color};border-color:${h.color}`:''}">
        <svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg></div>`;
    }
    const note = sk ? 'Skipped' :
      overdue(h) ? `⏰ Due since ${h.remind}`
      : h.type === 'list' ? (items(h,sel).length ? esc(items(h,sel).join(' · ')) : `Write ${h.target} things · ${schedLabel(h)}`)
      : h.type === 'num' ? `Goal ${h.target} ${esc(h.unit||'')} · ${schedLabel(h)}`
      : (h.days && h.days.length ? schedLabel(h)
         : st.current > 1 ? `${st.current} day streak` : freqLabel(h));
    return `<div class="card ${sk?'skipped':''} ${overdue(h)?'due':''} ${h.pinned?'pinned':''}" data-h="${h.id}">
      <div class="tint" style="background:${h.color}"></div>

      <p>${note}</p>${meter}</div>
      ${h.photo ? `<button class="cam" data-cam="${h.id}" aria-label="Photo">${CAM}</button>` : ''}
      ${right}</div>`;
  }).join('');

  screen.innerHTML = anyHabits ? `
    <div class="hero"><div class="glow" style="background:${lead ? lead.color : '#7C6BFF'}"></div>
      ${dial(sel)}
      <div style="flex:1;min-width:0">

             <div class="sub">${n === l.length ? 'All done, nothing left' : `${l.length-n} left to go`}</div>`
          : `<div class="num" style="font-size:30px">Rest day</div>
             <div class="sub">Nothing scheduled for this day</div>`}
        <div class="flame">🔥 ${fire} day${fire===1?'':'s'} perfect</div>
      </div></div>
    <div class="week">${week}</div>
    ${cards}
    ${taskSection()}
    ${off.length ? `<div class="later">Not today: ${off.map(h =>
      `<span>${h.icon ? esc(h.icon) : `<i style="background:${h.color}"></i>`}${esc(h.name)} · ${esc(schedLabel(h))}</span>`).join('')}</div>` : ''}
    <div style="height:8px"></div>`
  : `<div class="blank">No habits yet.<br>Tap + to start with one you can do today.</div>
     ${taskSection()}`;
  if (l.some(h => h.photo)) paintThumbs();
}

/* ---------- progress photos ----------
   Full images live under their own key so the main state stays small.
   Thumbnails are batched per habit in one key, so a gallery is a single read. */
const EMOJI = ['💪','🏃','🚲','🏊','🥊','🧗','🧘','😴','💧','🥗','🍳','☕','💊','🦷','🚿','🧹',
  '🗑️','🧺','📚','✍️','🧠','🎸','🎹','🎨','📷','💻','📈','💰','📞','🗣️','🌱','🐕',
  '🌞','🌙','🙏','🎯','⏰','🔥','🚭','🧊'];
const glyphChar = h => h.icon || (h.name.trim()[0] || '?').toUpperCase();
const CAM = '<svg viewBox="0 0 24 24"><path d="M9 3 7.2 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.2L15 3zm3 5.5A4.75 4.75 0 1 1 7.25 13.25 4.75 4.75 0 0 1 12 8.5zm0 2a2.75 2.75 0 1 0 0 5.5 2.75 2.75 0 0 0 0-5.5z"/></svg>';
const pKey = (hid,k) => `photo:${hid}:${k}`;
const tKey = hid => `thumbs:${hid}`;
const shotDays = h => Object.keys((S.photos || {})[h.id] || {}).sort();
const thumbCache = {};

async function getThumbs(hid){
  if (thumbCache[hid]) return thumbCache[hid];
  try{ const r = await window.storage.get(tKey(hid)); thumbCache[hid] = r && r.value ? JSON.parse(r.value) : {}; }
  catch(e){ thumbCache[hid] = {}; }
  return thumbCache[hid];
}
async function getPhoto(hid, k){
  try{ const r = await window.storage.get(pKey(hid,k)); return r && r.value ? r.value : ''; }
  catch(e){ return ''; }
}
async function shrink(file, max, q){
  let img, url = '';
  try{ img = await createImageBitmap(file, { imageOrientation:'from-image' }); }
  catch(e){ img = await new Promise((res,rej) => { const i = new Image();
    url = URL.createObjectURL(file);
    i.onload = () => res(i); i.onerror = rej; i.src = url; }); }
  const sc = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*sc); c.height = Math.round(img.height*sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  if (url) URL.revokeObjectURL(url);
  return c.toDataURL('image/jpeg', q);
}
async function addPhoto(h, k, file){
  toast('Saving photo…');
  try{
    const full = await shrink(file, 900, 0.7), thumb = await shrink(file, 190, 0.6);
    await window.storage.set(pKey(h.id,k), full);
    const th = await getThumbs(h.id); th[k] = thumb;
    await window.storage.set(tKey(h.id), JSON.stringify(th));
    thumbCache[h.id] = th;
    (S.photos ||= {}); (S.photos[h.id] ||= {})[k] = 1; save();
    toast(`Photo saved · ${shotDays(h).length} total`);
    render();
  }catch(e){ toast('Could not save that photo'); }
}
async function dropPhoto(h, k){
  try{ await window.storage.delete(pKey(h.id,k)); }catch(e){}
  const th = await getThumbs(h.id); delete th[k];
  try{ await window.storage.set(tKey(h.id), JSON.stringify(th)); }catch(e){}
  if (S.photos && S.photos[h.id]) delete S.photos[h.id][k];
  save(); render();
}

async function purgePhotos(hid){
  const days = Object.keys((S.photos || {})[hid] || {});
  for (const k of days){ try{ await window.storage.delete(pKey(hid,k)); }catch(e){} }
  try{ await window.storage.delete(tKey(hid)); }catch(e){}
  delete thumbCache[hid];
  if (S.photos) delete S.photos[hid];
  save();
}

async function openViewer(h, days, i){

async function paintViewer(){
  const k = viewSet[viewAt], h = viewH;
  const v = $('#viewer');
  v.innerHTML = `<img src="${await getPhoto(h.id,k) || ''}" alt="">
    <div class="vinfo">${pd(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
      <em>${esc(h.name)} · ${viewAt+1} of ${viewSet.length}${viewSet.length>1 && viewAt>0

      <button id="vd">Delete</button>

async function paintThumbs(){

function taskSection(){

/* ---------- tap / hold ---------- */
let hold = null, held = false, pressed = null;
screen.addEventListener('pointerdown', e => {
  const tsk = e.target.closest('.task');
  if (tsk){ held = false; pressed = tsk; tsk.classList.add('press');
    hold = setTimeout(() => { held = true; if (navigator.vibrate) navigator.vibrate(18);
      taskForm(S.tasks.find(x => x.id === tsk.dataset.task)); }, 420);
    return; }
  const c = e.target.closest('.card'); if (!c) return;
  held = false; pressed = c; c.classList.add('press');
  hold = setTimeout(() => { held = true;
    if (navigator.vibrate) navigator.vibrate(18);
    const h = S.habits.find(x => x.id === c.dataset.h);
    setVal(h, sel, skipped(h,sel) ? 0 : -1); toast(skipped(h,sel) ? 'Skipped — streak safe' : 'Skip removed'); render();
  }, 420);
});
function release(){ clearTimeout(hold); if (pressed){ pressed.classList.remove('press'); pressed = null; } }
screen.addEventListener('pointerup', e => {
  release();
  if (swiped) return;
  const day = e.target.closest('[data-day]');
  if (day){
    const dir = day.dataset.day > sel ? 1 : -1;
    sel = day.dataset.day; render();
    if (!slow()) screen.querySelectorAll('.card').forEach((el,i) => el.animate(
      [{opacity:0, transform:`translateX(${dir*18}px)`},{opacity:1, transform:'none'}],
      {duration:260, delay:Math.min(i*22,160), easing:'cubic-bezier(.16,1,.3,1)', fill:'backwards'}));
    return;
  }
  const cm = e.target.closest('[data-cam]');
  if (cm && !held){ const h = S.habits.find(x => x.id === cm.dataset.cam);
    const has = (S.photos?.[h.id] || {})[sel];
    if (has) return openViewer(h, shotDays(h), shotDays(h).indexOf(sel));
    return pickPhoto(h, sel); }
  if (e.target.closest('#at') && !held) return taskForm(null);
  const tsk = e.target.closest('.task');
  if (tsk && !held){
    const t = S.tasks.find(x => x.id === tsk.dataset.task);
    if (t){
      t.doneAt = t.doneAt ? '' : sel; save();
      if (t.doneAt && navigator.vibrate) navigator.vibrate(12);
      render();
      if (t.doneAt && !tasksFor(sel).some(x => !x.doneAt)) toast('Task list clear');
    }
    return;
  }
  const c = e.target.closest('.card');
  if (c && !held){
    const h = S.habits.find(x => x.id === c.dataset.h);
    if (e.target.closest('.glyph') || e.target.closest('.body h3')) return openDetail(h.id);
    if (h.type === 'list') return listEditor(h, sel);
    if (h.type === 'num') return keypad(h, sel);
    const was = done(h,sel);
    setVal(h, sel, was || skipped(h,sel) ? 0 : 1);
    const tick = c.querySelector('.tick');
    if (!was && tick){
      tick.classList.add('on','pop'); tick.style.background = h.color; tick.style.borderColor = h.color;
      if (navigator.vibrate) navigator.vibrate(10);
      setTimeout(() => tick.classList.remove('pop'), 190);
      setTimeout(() => { celebrate(h); render(); }, 330);
    } else render();
  }
  const g = e.target.closest('.gcell[data-h]');
  if (g && !held){ const h = S.habits.find(x => x.id === g.dataset.h);
    if (h.type === 'list') listEditor(h, g.dataset.k);
    else if (h.type === 'num') keypad(h, g.dataset.k);
    else { setVal(h, g.dataset.k, done(h,g.dataset.k) ? 0 : 1); render(); } }
  const s = e.target.closest('[data-detail]');
  if (s && !held) openDetail(s.dataset.detail);
});
screen.addEventListener('pointercancel', release);
screen.addEventListener('pointerleave', release);
screen.addEventListener('contextmenu', e => e.preventDefault());

function celebrate(h){
  if (sel === key(today()) && perfect(sel) && live().length > 1){
    burst(); toast(`Perfect day — ${fireStreak()} in a row 🔥`);
  } else { const st = streaks(h);
    if ([3,7,14,21,30,50,100,200,365].includes(st.current)){ burst(); toast(`${st.current} day streak on ${h.name}`); } }
}

function renderGrid(){
  $('#title').textContent = 'History'; $('#sub').textContent = 'Tap any square to fix a day';
  const t = today(), l = live();
  cols = Math.max(4, Math.min(7, Math.floor((Math.min(window.innerWidth,520) - 130) / 46)));
  document.documentElement.style.setProperty('--cw', Math.floor((Math.min(window.innerWidth,520)-32-118)/cols)+'px');
  if (!l.length) return screen.innerHTML = `<div class="blank">Nothing to show yet.</div>`;

  let head = '<div style="flex:1"></div>';
  for (let i = 0; i < cols; i++){ const d = shift(t,-(page*cols+i));
    head += `<div class="gcell">${WD3[d.getDay()]}<b>${d.getDate()}</b></div>`; }

  const rows = l.map(h => {
    let cells = '';
    for (let i = 0; i < cols; i++){
      const k = key(shift(t,-(page*cols+i))), r = ratio(h,k);
      let inner;
      if (!dueOn(h,k)){ cells += `<div class="gcell"><div class="offday"></div></div>`; continue; }
      if (skipped(h,k)) inner = `<div class="box" style="background:${h.color};opacity:.22"></div>`;
      else if (h.type === 'list') inner = `<span style="color:${done(h,k)?h.color:'var(--dim)'};opacity:${items(h,k).length?1:.4}">${items(h,k).length||'–'}</span>`;
      else if (h.type === 'num') inner = `<span style="color:${done(h,k)?h.color:'var(--dim)'};opacity:${val(h,k)>0?1:.4}">${val(h,k)>0?+val(h,k).toFixed(2):'–'}</span>`;
      else inner = `<div class="box" style="background:${done(h,k)?h.color:'var(--faint)'}">${done(h,k)?'<svg viewBox="0 0 24 24"><path d="M5 12.5 10 17.5 19 7"/></svg>':''}</div>`;
      cells += `<div class="gcell" data-h="${h.id}" data-k="${k}">${inner}</div>`;
    }
    return `<div class="grow"><div class="gname" data-detail="${h.id}">
      ${h.icon ? `<span class="gem">${esc(h.icon)}</span>` : `<div class="gdot" style="background:${h.color}"></div>`}
      <span>${esc(h.name)}</span></div>${cells}</div>`;
  }).join('');

  screen.innerHTML = `<div class="pager">
      <button id="back7">← Earlier</button>
      <span style="font-size:13px;color:var(--dim);font-weight:600">${
        pd(key(shift(t,-(page*cols+cols-1)))).toLocaleDateString(undefined,{month:'short',day:'numeric'})} – ${
        pd(key(shift(t,-page*cols))).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>
      <button id="fwd7" ${page===0?'disabled':''}>Later →</button></div>
    <div class="ghead">${head}</div><div class="grid">${rows}</div><div style="height:20px"></div>`;
  $('#back7').onclick = () => { page++; render(); };
  $('#fwd7').onclick = () => { page = Math.max(0,page-1); render(); };
}

function sheet(html){

  $('#scrim').classList.add('on');
  $('#scrim').onclick = e => { if (e.target === $('#scrim')) shut(); };
  return $('#scrim').querySelector('.sheet');
}
function shut(){ $('#scrim').classList.remove('on'); $('#scrim').innerHTML = ''; }
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(t._x); t._x = setTimeout(() => t.classList.remove('on'), 2100); }

/* ---------- calendar reminders (.ics) ---------- */
const pad2 = n => String(n).padStart(2,'0');
const overdue = h => { if (!h.remind || sel !== key(today()) || done(h,sel) || skipped(h,sel)) return false;
  const [hh,mm] = h.remind.split(':').map(Number), n = new Date();
  return n.getHours()*60 + n.getMinutes() >= hh*60 + mm; };

function icsText(){
  const t = today(), stamp = d => d.getFullYear()+pad2(d.getMonth()+1)+pad2(d.getDate());
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Habits//EN','CALSCALE:GREGORIAN'];
  live().filter(h => h.remind).forEach(h => {
    const [hh,mm] = h.remind.split(':');
    const sched = h.days && h.days.length && h.days.length < 7;
    let first = t;
    if (sched){ let i = 0; while (!h.days.includes(shift(t,i).getDay()) && i < 7) i++; first = shift(t,i); }
    const start = stamp(first)+'T'+hh+mm+'00';
    const eh = Math.min(+hh*60 + +mm + 15, 23*60 + 59);   // never roll past midnight
    const end = stamp(first)+'T'+pad2(Math.floor(eh/60))+pad2(eh%60)+'00';
    L.push('BEGIN:VEVENT',
      'UID:habit-'+h.id+'@habits.local',
      'DTSTAMP:'+stamp(new Date())+'T000000Z',
      'DTSTART:'+start, 'DTEND:'+end,
      'RRULE:' + (sched ? 'FREQ=WEEKLY;BYDAY=' + h.days.map(d => ['SU','MO','TU','WE','TH','FR','SA'][d]).join(',')
                        : 'FREQ=DAILY'),
      'SUMMARY:'+(h.question || h.name).replace(/[,;\\]/g,''),
      'DESCRIPTION:'+(h.type==='num' ? `Goal ${h.target} ${h.unit}` : schedLabel(h)),
      'BEGIN:VALARM','ACTION:DISPLAY','TRIGGER:PT0M',
      'DESCRIPTION:'+h.name.replace(/[,;\\]/g,''),'END:VALARM','END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}
function reminders(){
  const withTime = live().filter(h => h.remind), without = live().filter(h => !h.remind);
  const el = sheet(`<h2>Reminders</h2>
    <p class="note">This app can't send push notifications from inside Claude. What it can do is hand your reminder times to your phone's Calendar, which nags you properly — lock screen, Apple Watch, the lot.</p>
    ${withTime.length ? withTime.map(h => `<div class="mrow"><div class="gdot" style="background:${h.color}"></div>
        <span style="flex:1">${esc(h.name)}</span><b style="font-variant-numeric:tabular-nums">${h.remind}</b></div>`).join('')
      : '<p class="note" style="color:#FFC53D">No reminder times set yet. Open a habit → Edit → "Remind me at".</p>'}
    ${without.length ? `<p class="note" style="margin-top:14px">No time set: ${without.map(h => esc(h.name)).join(', ')}</p>` : ''}
    <div style="height:12px"></div>
    <button class="big" id="ics" ${withTime.length?'':'disabled style="opacity:.45"'}>Add ${withTime.length} to Calendar</button>
    <button class="ghost" id="cx">Close</button>`);
  el.querySelector('#cx').onclick = shut;
  el.querySelector('#ics').onclick = () => {
    if (!withTime.length) return;
    const txt = icsText(), a = document.createElement('a');
    a.href = 'data:text/calendar;charset=utf-8,' + encodeURIComponent(txt);
    a.download = 'habit-reminders.ics'; a.click();
    toast('Open the file to add it to Calendar');
  };
}

function originCard(h){

  return `<div class="tile" style="margin-top:10px">
    <div class="orig"><b style="color:${h.color}">Day ${tracked}</b><span>of tracking</span></div>

function keypad(h, k){
  let buf = val(h,k) > 0 ? String(+val(h,k).toFixed(2)) : '';
  const el = sheet(`<h2>${esc(h.name)}</h2>
    <p class="note">${pd(k).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})} · goal ${h.target} ${esc(h.unit||'')}</p>
    <div class="disp"><b id="d" style="color:${h.color}">0</b><span>${esc(h.unit||'')}</span></div>
    <div class="pad" id="pad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button data-k=".">.</button><button data-k="0">0</button>
      <button data-k="del"><svg viewBox="0 0 24 24"><path d="M22 3H7L1 12l6 9h15a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-3.3 12.3-1.4 1.4L14 13.4l-3.3 3.3-1.4-1.4L12.6 12 9.3 8.7l1.4-1.4L14 10.6l3.3-3.3 1.4 1.4L15.4 12z"/></svg></button>
    </div>
    <button class="big" id="ok" style="--ac:${h.color}">Save</button>
    <button class="ghost" id="rm">Clear this day</button>`);
  const d = el.querySelector('#d');
  const paint = () => d.textContent = buf === '' ? '0' : buf;
  paint();
  el.querySelector('#pad').onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    const c = b.dataset.k;
    if (c === 'del') buf = buf.slice(0,-1);
    else if (c === '.' ){ if (!buf.includes('.')) buf = (buf || '0') + '.'; }
    else if (buf.replace('.','').length < 7) buf = (buf === '0' ? '' : buf) + c;
    if (navigator.vibrate) navigator.vibrate(6);
    paint();
  };
  el.querySelector('#rm').onclick = () => { setVal(h,k,0); shut(); render(); };
  el.querySelector('#ok').onclick = () => {
    const v = parseFloat(buf); const was = done(h,k);
    setVal(h,k, isNaN(v) ? 0 : v); shut();
    if (!was && done(h,k)) celebrate(h);
    render();
  };
}

const PIN = '<svg viewBox="0 0 24 24"><path d="M14 3.5v5.6l2.8 2.8v2H12.9v5.1l-.9 2.1-.9-2.1v-5.1H7.2v-2L10 9.1V3.5z"/></svg>';

function orderSheet(){
  const el = sheet(`<h2>Order and pins</h2>
    <p class="note">Drag to reorder. Pinned habits hold the top of the list, above everything else.</p>
    <div id="rs"></div>
    <div style="height:12px"></div><button class="big" id="ok" style="--ac:#7C6BFF">Done</button>`);
  const box = el.querySelector('#rs');
  let dragId = null, startY = 0, from = 0, lo = 0, hi = 0, rowH = 56;

  const draw = () => {
    box.innerHTML = live().map(h => `<div class="rr ${h.pinned?'pinned':''}" data-id="${h.id}">
      <span class="rh">⣿</span>
      ${h.icon ? `<span class="gem">${esc(h.icon)}</span>` : `<span class="gdot" style="background:${h.color}"></span>`}
      <span class="rn">${esc(h.name)}</span>
      <button class="pinb ${h.pinned?'on':''}" data-pin="${h.id}" aria-label="Pin">${PIN}</button></div>`).join('');
  };
  draw();

  box.addEventListener('pointerdown', e => {
    if (e.target.closest('[data-pin]')) return;
    const row = e.target.closest('.rr'); if (!row) return;
    const L = live(), pins = L.filter(h => h.pinned).length;
    dragId = row.dataset.id;
    from = L.findIndex(h => h.id === dragId);
    if (L[from].pinned){ lo = 0; hi = pins - 1; } else { lo = pins; hi = L.length - 1; }
    rowH = row.offsetHeight + 8; startY = e.clientY;
    row.classList.add('lift');
    box.setPointerCapture(e.pointerId);
    if (navigator.vibrate) navigator.vibrate(10);
  });
  box.addEventListener('pointermove', e => {
    if (!dragId) return;
    const row = box.querySelector(`[data-id="${dragId}"]`); if (!row) return;
    const dy = e.clientY - startY;
    row.style.transform = `translateY(${dy}px)`;
    const to = Math.max(lo, Math.min(hi, from + Math.round(dy / rowH)));
    if (to !== from){
      setOrder(live(), from, to);
      from = to; startY = e.clientY;
      draw();
      const next = box.querySelector(`[data-id="${dragId}"]`);
      if (next){ next.classList.add('lift'); next.style.transform = ''; }
      if (navigator.vibrate) navigator.vibrate(6);
    }
  });
  const drop = () => { if (!dragId) return;
    const row = box.querySelector(`[data-id="${dragId}"]`);
    if (row){ row.classList.remove('lift'); row.style.transform = ''; }
    dragId = null; render(); };
  box.addEventListener('pointerup', drop);
  box.addEventListener('pointercancel', drop);

  box.addEventListener('click', e => {
    const b = e.target.closest('[data-pin]'); if (!b) return;
    const h = S.habits.find(x => x.id === b.dataset.pin);
    h.pinned = !h.pinned; save(); draw(); render();
    if (navigator.vibrate) navigator.vibrate(12);
    toast(h.pinned ? `${h.name} pinned to top` : `${h.name} unpinned`);
  });
  el.querySelector('#ok').onclick = shut;
}

      <div class="fld"><em>How often</em><select id="fq">${FREQS.map(f =>
        `<option value="${f[0]}/${f[1]}" ${!(h.days&&h.days.length)&&h.fnum===f[0]&&h.fden===f[1]?'selected':''}>${f[2]}</option>`).join('')}
        <option value="days" ${h.days&&h.days.length?'selected':''}>On set days…</option></select></div>
      <div class="fld"><em>Remind me at</em><input id="rm" type="time" value="${h.remind||''}"></div>
    </div>
    <div class="fld"><em>Extras</em>
      <button class="optrow ${h.photo?'on':''}" id="ph" type="button">
        <span class="obox">${CAM}</span>
        <span class="otxt"><b>Attach a photo</b><em>Adds a camera to this habit. For progress shots.</em></span>
        <span class="odot"></span></button></div>
    <div class="fld" id="dw" style="display:${h.days&&h.days.length?'block':'none'}">
      <em>Which days</em><div class="days7" id="dp">${DAYSHORT.map((d,i) =>
        `<button data-d="${i}" class="${h.days&&h.days.includes(i)?'on':''}">${d[0]}</button>`).join('')}</div></div>
    <div class="fld"><em>Color</em><div class="sw" id="cl">${COLORS.map(c =>
      `<button data-c="${c}" style="background:${c};color:${c}" class="${c===color?'on':''}"></button>`).join('')}</div></div>
    <button class="big" id="sv" style="--ac:${color}">${existing ? 'Save changes' : 'Start tracking'}</button>
    ${existing ? '<button class="ghost danger" id="dl">Delete habit and history</button>' : '<button class="ghost" id="cx">Cancel</button>'}`);
  el.style.setProperty('--ac', color);
  el.querySelector('#ty').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    type = b.dataset.t; el.querySelectorAll('#ty button').forEach(x => x.classList.toggle('on', x === b));
    el.querySelector('#nf').style.display = type === 'num' ? 'block' : 'none';
    el.querySelector('#lf').style.display = type === 'list' ? 'block' : 'none'; };
  let icon = h.icon || '';
  const ic = el.querySelector('#ic'), ip = el.querySelector('#ip');
  const setIcon = v => { icon = Array.from(v.trim()).slice(0,3).join('');
    ic.value = icon; ip.classList.toggle('emoji', !!icon);
    ip.textContent = icon || ((el.querySelector('#nm').value.trim()[0] || '?').toUpperCase());
    el.querySelectorAll('#eg button').forEach(b => b.classList.toggle('on', b.dataset.e === icon)); };
  const eg = el.querySelector('#eg'), egb = el.querySelector('#egb');
  const showGrid = on => { eg.classList.toggle('open', on); egb.classList.toggle('on', on);
    egb.textContent = on ? 'Hide the emoji' : '😀 Pick an emoji'; };
  egb.onclick = () => showGrid(!eg.classList.contains('open'));
  eg.onclick = e => { const b = e.target.closest('button'); if (!b) return;
    const same = b.dataset.e === icon;
    setIcon(same ? '' : b.dataset.e);
    if (!same) showGrid(false);                       // picked one, get out of the way
    if (navigator.vibrate) navigator.vibrate(6); };
  el.querySelector('#icx').onclick = () => setIcon('');
  ic.oninput = () => setIcon(ic.value);
  el.querySelector('#nm').addEventListener('input', () => { if (!icon) setIcon(''); });
  setIcon(icon);
  let photo = !!h.photo;
  const pb = el.querySelector('#ph');
  pb.onclick = () => { photo = !photo; pb.classList.toggle('on', photo);
    if (navigator.vibrate) navigator.vibrate(8); };
  let picked = (h.days || []).slice();
  const fq = el.querySelector('#fq');
  fq.onchange = () => { el.querySelector('#dw').style.display = fq.value === 'days' ? 'block' : 'none'; };
  el.querySelector('#dp').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    const d = +b.dataset.d;
    picked.includes(d) ? picked = picked.filter(x => x !== d) : picked.push(d);
    b.classList.toggle('on'); if (navigator.vibrate) navigator.vibrate(6); };
  el.querySelector('#cl').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    color = b.dataset.c; el.querySelectorAll('#cl button').forEach(x => x.classList.toggle('on', x === b));
    el.style.setProperty('--ac', color); el.querySelector('#sv').style.setProperty('--ac', color);
    el.querySelector('#ip').style.background = color; };
  const syncUnits = () => { const u = el.querySelector('#un').value.trim();
    el.querySelectorAll('#up button').forEach(b => b.classList.toggle('on', b.dataset.u === u)); };
  el.querySelector('#up').onclick = e => { const b = e.target.closest('button'); if (!b) return;
    el.querySelector('#un').value = b.dataset.u; syncUnits();
    if (navigator.vibrate) navigator.vibrate(6); };
  el.querySelector('#un').oninput = syncUnits;
  if (!existing) el.querySelector('#cx').onclick = shut;
  else el.querySelector('#dl').onclick = async () => {
    const n = Object.keys((S.photos || {})[existing.id] || {}).length;
    await purgePhotos(existing.id);
    S.habits = S.habits.filter(x => x.id !== existing.id); delete S.log[existing.id];
    save(); shut(); open = null; nav('today');
    toast(n ? `Habit and ${n} photo${n===1?'':'s'} deleted` : 'Habit deleted'); };
  el.querySelector('#sv').onclick = () => {
    const name = el.querySelector('#nm').value.trim();
    if (!name){ el.querySelector('#nm').focus(); el.querySelector('#nm').style.borderColor = '#FF6B6B'; return; }
    const fv = el.querySelector('#fq').value;
    const days = fv === 'days' ? picked.slice().sort((a,b)=>a-b) : [];
    if (fv === 'days' && !days.length){ el.querySelector('#dw').scrollIntoView({block:'center'});
      el.querySelector('#dp').animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'none'}],
        {duration:220}); return; }
    const [fn,fd] = fv === 'days' ? [days.length,7] : fv.split('/').map(Number);
    const data = { name, question: el.querySelector('#qs').value.trim(), type, color,
      remind: el.querySelector('#rm').value || '', photo, icon,
      unit: type==='num' ? el.querySelector('#un').value.trim() : '',
      target: type==='num' ? (parseFloat(el.querySelector('#tg').value)||1)
            : type==='list' ? Math.max(1, parseInt(el.querySelector('#lt').value)||3) : 1,
      fnum:fn, fden:fd, days };
    if (existing){
      const from = existing.unit, to = data.unit;
      const swap = existing.type === 'num' && type === 'num' &&
        ((from === 'km' && to === 'mi') || (from === 'mi' && to === 'km'));
      if (swap){
        const n = Object.values(S.log[existing.id]||{}).filter(v => v > 0).length;
        Object.assign(existing, data);
        save(); shut();
        return askConvert(existing, from, to, n);
      }
      Object.assign(existing, data);
    }
    else { S.habits.push(Object.assign({id:'h'+Date.now().toString(36), archived:false,
      pinned:false, pos:S.habits.length, created:key(today())}, data)); toast('Habit added'); }
    save(); shut(); render();
  };
  setTimeout(() => el.querySelector('#nm').focus(), 120);
}

/* ================= menu ================= */
$('#menu').onclick = () => {
  const el = sheet(`<h2>Settings</h2><p class="note">Everything is stored on this device.</p>
    <button class="mrow" data-a="theme">${S.theme==='dark'?'☀️':'🌙'} ${S.theme==='dark'?'Light appearance':'Dark appearance'}</button>
    <button class="mrow" data-a="ord">↕️ Order and pins</button>
    <button class="mrow" data-a="rem">⏰ Reminders</button>
    <button class="mrow" data-a="arch">📦 Archived habits</button>
    <button class="mrow" data-a="exp">⬇️ Export my data</button>
    <button class="mrow" data-a="imp">⬆️ Import data</button>
    <div style="height:14px"></div><button class="ghost" id="cx">Close</button>`);
  el.onclick = e => { const b = e.target.closest('[data-a]'); if (e.target.id === 'cx') return shut(); if (!b) return;
    const a = b.dataset.a; shut();
    if (a === 'theme'){ S.theme = S.theme === 'dark' ? 'light' : 'dark'; theme(); save(); }
    if (a === 'arch') archived();
    if (a === 'rem') reminders();
    if (a === 'ord') orderSheet();
    if (a === 'exp') exportData();
    if (a === 'imp') importData(); };
};
function theme(){ document.body.classList.toggle('light', S.theme === 'light');
  const m = document.querySelector('meta[name=theme-color]');
  if (m) m.content = S.theme === 'light' ? '#F3F2F7' : '#0B0B10'; }
function archived(){
  const a = S.habits.filter(h => h.archived);
  const el = sheet(`<h2>Archived</h2><p class="note">${a.length ? 'History is kept. Restore any time.' : 'Nothing archived yet. Archiving hides a habit without losing its history.'}</p>
    ${a.map(h => `<div class="mrow"><div class="gdot" style="background:${h.color}"></div>
      <span style="flex:1">${esc(h.name)}</span>
      <button data-r="${h.id}" style="font-size:13px;font-weight:800;color:${h.color}">RESTORE</button></div>`).join('')}
    <div style="height:14px"></div><button class="ghost" id="cx">Close</button>`);
  el.onclick = e => { if (e.target.id === 'cx') return shut();
    const r = e.target.dataset && e.target.dataset.r;
    if (r){ S.habits.find(h => h.id === r).archived = false; save(); shut(); render(); toast('Restored'); } };
}
function exportData(){
  const el = sheet(`<h2>Export</h2><p class="note">Copy this text somewhere safe, or download it. Paste it into Import to restore.</p>
    <textarea readonly rows="6" style="font-family:ui-monospace,monospace;font-size:12px">${esc(JSON.stringify(S))}</textarea>
    <div style="height:14px"></div><button class="big" id="dl">Download data only</button>
    <button class="ghost" id="full">Download full backup with photos</button>
    <button class="ghost" id="cx">Close</button>`);
  el.querySelector('textarea').onclick = e => e.target.select();
  el.querySelector('#cx').onclick = shut;
  el.querySelector('#dl').onclick = () => { const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
    a.download = 'habits-'+key(today())+'.json'; a.click(); };
  el.querySelector('#full').onclick = async () => {
    const btn = el.querySelector('#full'); btn.textContent = 'Collecting photos…';
    const out = { state:S, photos:{} };
    for (const hid in (S.photos || {})){
      out.photos[hid] = {};
      for (const k in S.photos[hid]){
        const full = await getPhoto(hid, k);
        if (full) out.photos[hid][k] = full;
      }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify(out)],{type:'application/json'}));
    a.download = 'habits-full-'+key(today())+'.json'; a.click();
    btn.textContent = 'Download full backup with photos';
    toast('Full backup downloaded');
  };
}
/* data: URL back to a Blob, so shrink() can rebuild a thumbnail from it */
const dataBlob = src => {
  const [meta, b64] = src.split(',');
  const bin = atob(b64), u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new Blob([u], { type: (meta.match(/:(.*?);/) || [,'image/jpeg'])[1] });
};
/* writes the photos out of a full backup, returns the index for S.photos */
async function restorePhotos(photos){
  const index = {};
  for (const hid in photos){
    const th = {};
    for (const k in photos[hid]){
      const full = photos[hid][k];
      if (!full) continue;
      try{
        await window.storage.set(pKey(hid,k), full);
        try{ th[k] = await shrink(dataBlob(full), 190, 0.6); }catch(e){ th[k] = full; }
        (index[hid] ||= {})[k] = 1;
      }catch(e){}
    }
    try{ await window.storage.set(tKey(hid), JSON.stringify(th)); }catch(e){}
    thumbCache[hid] = th;
  }
  return index;
}
function importData(){
  const el = sheet(`<h2>Import</h2><p class="note" id="nt">This replaces everything currently stored here. Either export works: data only, or the full backup with photos.</p>
    <textarea rows="6" placeholder='{"habits":[…]}' style="font-family:ui-monospace,monospace;font-size:12px"></textarea>
    <div style="height:14px"></div><button class="big" id="ok">Replace my data</button><button class="ghost" id="cx">Cancel</button>`);
  el.querySelector('#cx').onclick = shut;
  el.querySelector('#ok').onclick = async () => {
    const btn = el.querySelector('#ok'), nt = el.querySelector('#nt');
    let d = null;
    try{ d = JSON.parse(el.querySelector('textarea').value); }catch(e){}
    // Export writes two shapes: the state on its own, or { state, photos } for a full backup.
    const bak = d && d.state && Array.isArray(d.state.habits) ? d : null;
    const st = bak ? bak.state : d;
    if (!st || !Array.isArray(st.habits)){
      nt.textContent = "That isn't habit data. Paste the whole text from Export.";
      nt.style.color = '#FF6B6B'; return;
    }
    btn.disabled = true;
    for (const k in thumbCache) delete thumbCache[k];
    if (bak){
      btn.textContent = 'Restoring photos…';
      for (const hid of Object.keys(S.photos || {})) await purgePhotos(hid);
    }
    S = Object.assign({theme:'dark', habits:[], log:{}, tasks:[], photos:{}}, st);
    S.log ||= {}; S.tasks ||= []; S.photos ||= {};
    if (bak) S.photos = await restorePhotos(bak.photos || {});
    save(); theme(); shut(); nav('today');
    toast(bak ? 'Data and photos restored' : 'Data restored');
  };
}

/* ================= confetti ================= */
const cv = $('#confetti'), cx = cv.getContext('2d');
function burst(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = live().map(h => h.color), P = [];
  for (let i = 0; i < 70; i++) P.push({ x: innerWidth/2 + (Math.random()-.5)*90, y: innerHeight*.34,
    vx: (Math.random()-.5)*13, vy: -7-Math.random()*11, r: 3+Math.random()*5,
    a: Math.random()*6, s: (Math.random()-.5)*.4, c: cols[i%cols.length]||'#7C6BFF' });
  let f = 0;
  (function step(){
    cx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p => { p.vy += .46; p.x += p.vx; p.y += p.vy; p.a += p.s;
      cx.save(); cx.translate(p.x,p.y); cx.rotate(p.a); cx.globalAlpha = Math.max(0,1-f/78);
      cx.fillStyle = p.c; cx.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2); cx.restore(); });
    if (++f < 80) requestAnimationFrame(step); else cx.clearRect(0,0,cv.width,cv.height);
  })();
  if (navigator.vibrate) navigator.vibrate([12,40,12]);
}

/* ================= boot ================= */
$('#pf').onchange = e => { const f = e.target.files && e.target.files[0];
  if (f && pendingShot) addPhoto(pendingShot.h, pendingShot.k, f); pendingShot = null; };
$('#add').onclick = () => tab === 'today' ? addChooser() : form(null);
$('#back').onclick = () => nav(tab);
$('#nav').onclick = e => { const b = e.target.closest('button'); if (b) nav(b.dataset.t); };
addEventListener('resize', () => { movePill(true); if (tab === 'grid' && !open) render(); });

(async function(){
  await load(); theme();
  S.habits.forEach((h,i) => { if (h.pos === undefined) h.pos = i; if (h.pinned === undefined) h.pinned = false;
    if (!h.created) h.created = Object.keys(S.log[h.id] || {}).sort()[0] || key(today()); });
  save();
  render();
  stagger();
  requestAnimationFrame(() => movePill(true));
})();
</script>
